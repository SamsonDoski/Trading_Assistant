name: Deploy to Lambda

on:
  push:
    branches: [ "mainV5.0" ]      # deploy only when the production branch updates
  workflow_dispatch:               # ...or trigger manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (deploy gate)
        run: pytest -q

      - name: Build function package
        run: |
          zip -r function.zip aws live_controller.py engine utils strategies memory/stock_profile.json config.py -x '*/__pycache__/*' '*.pyc'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        # One build, pushed to every deployment. Each function runs the SAME code
        # and differs only by its environment variables (Alpaca keys, ALPACA_PAPER,
        # ACTIVE_MODE, Discord webhook), so accounts stay isolated: separate
        # schedules, separate failures, separate notifications.
        # Add a function name here only AFTER creating it in AWS — a missing
        # function fails this step and blocks the whole deploy.
        env:
          FUNCTIONS: "trading-assistant-live trading-assistant-live-secondary"
        run: |
          for function_name in $FUNCTIONS; do
            echo "Deploying to $function_name..."
            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file fileb://function.zip \
              --region us-east-1
          done